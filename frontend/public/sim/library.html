<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Library — Trapped-Ion QIS papers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%E2%9A%9B%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/style.css" />
  <style>
    html, body { height: auto; overflow: auto; }
    .lib-top { display: flex; align-items: center; gap: 14px; padding: 14px 22px;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(6px); }
    .lib-top .logo { font-size: 22px; }
    .lib-top h1 { font-size: 17px; margin: 0; }
    .lib-top .sub { font-size: 12px; color: var(--muted); }
    .lib-top .spacer { flex: 1; }
    .lib-top a, .lib-top button { font-size: 12.5px; color: var(--accent); text-decoration: none;
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; background: var(--btn); cursor: pointer; }
    .lib-wrap { max-width: 960px; margin: 0 auto; padding: 20px 22px 80px; }
    .lib-search { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 13.5px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--btn); color: var(--text); margin-bottom: 6px; }
    .lib-count { font-size: 12px; color: var(--muted); margin: 4px 2px 16px; }
    .lib-card { display: flex; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .lib-card.hidden { display: none; }
    .lib-rank { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); min-width: 26px; padding-top: 2px; }
    .lib-main { flex: 1; min-width: 0; }
    .lib-title { font-size: 14.5px; font-weight: 650; line-height: 1.35; margin-bottom: 3px; }
    .lib-auth { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .lib-venue { font-size: 11.5px; color: var(--muted); font-style: italic; margin-top: 2px; }
    .lib-actions { display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
    .lib-actions a { font-size: 12px; text-decoration: none; border: 1px solid var(--border);
      border-radius: 7px; padding: 4px 10px; color: var(--text); }
    .lib-actions a.read { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .lib-actions a:hover { filter: brightness(1.07); }
    .lib-refonly { font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 7px; padding: 4px 10px; font-style: italic; }
    .lib-note { font-size: 11.5px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
    /* module filter chips */
    .lib-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .lib-chip { font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--btn);
      color: var(--muted); border-radius: 999px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
    .lib-chip:hover { background: var(--btn-hover); color: var(--text); }
    .lib-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .lib-chip .n { opacity: .7; font-weight: 500; margin-left: 3px; }
    /* per-card module tags */
    .lib-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .lib-tag { font-size: 10.5px; font-weight: 700; border: 1px solid var(--accent);
      color: var(--accent); border-radius: 5px; padding: 1px 6px; }
    .lib-tag.other { border-color: var(--border); color: var(--muted); }
    /* parameter-match hint */
    .lib-hint { font-size: 12.5px; color: var(--text); margin: 2px 2px 8px; line-height: 1.5; display: none; }
    .lib-hint.show { display: block; }
    .lib-hint b { color: var(--accent); }
    .lib-hint .pill { display: inline-block; font-size: 11px; font-weight: 700; border: 1px solid var(--accent);
      color: var(--accent); border-radius: 5px; padding: 0 6px; margin: 0 2px; }
    .lib-tips { font-size: 11.5px; color: var(--muted); margin: 2px 2px 10px; }
    .lib-tips b { color: var(--text); cursor: pointer; border-bottom: 1px dotted var(--muted); }
    /* three-approach explainer + chips */
    .lib-approach-intro { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 8px 2px 8px; }
    .lib-approach-intro > b { color: var(--text); }
    .lib-approach-intro .ai-item { display: block; margin: 5px 0 0 6px; padding-left: 9px; border-left: 3px solid var(--ac, var(--border)); }
    .lib-approach-intro .ai-item b { color: var(--ac); }
    .lib-approaches { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 2px 14px; }
    .lib-appr-chip { font-size: 12px; font-weight: 700; border: 1px solid var(--ac, var(--border)); color: var(--ac, var(--muted));
      background: color-mix(in srgb, var(--ac, var(--muted)) 12%, transparent); border-radius: 999px; padding: 6px 13px; cursor: pointer; white-space: nowrap; }
    .lib-appr-chip[data-a="all"] { --ac: var(--accent); }
    .lib-appr-chip:hover { background: color-mix(in srgb, var(--ac, var(--muted)) 22%, transparent); }
    .lib-appr-chip.on { background: var(--ac, var(--accent)); color: #fff; }
    .lib-appr-chip .n { opacity: .75; font-weight: 500; margin-left: 4px; }
    /* per-card approach badge */
    .lib-appr { font-size: 10.5px; font-weight: 800; border-radius: 5px; padding: 1px 7px; color: #fff; }
    .lib-appr.appr-optical { background: #4A90D9; }
    .lib-appr.appr-raman { background: #50C878; }
    .lib-appr.appr-magic { background: #FF8C00; }
    .lib-appr.appr-general { background: #b57edc; }
  </style>
</head>
<body>
  <header class="lib-top">
    <span class="logo">⚛</span>
    <div><h1>Trapped-Ion QIS Library</h1><div class="sub">the three main approaches — read with the AI copilot</div></div>
    <span class="spacer"></span>
    <a href="ion.html">← Visualizer</a>
    <a href="pdh.html">🔒 PDH sim</a>
  </header>
  <div class="lib-wrap">
    <input id="lib-search" class="lib-search" type="search" list="lib-suggest"
           placeholder="Type a parameter (η, ω_z, Doppler, Mølmer–Sørensen, readout…) or a title / author" autocomplete="off" />
    <datalist id="lib-suggest"></datalist>
    <div class="lib-hint" id="lib-hint"></div>
    <div class="lib-approach-intro" id="lib-approach-intro"></div>
    <div class="lib-approaches" id="lib-approaches"></div>
    <div class="lib-count" id="lib-count"></div>
    <div class="lib-filters" id="lib-filters"></div>
    <div id="lib-list"></div>
    <div class="lib-note" id="lib-note"></div>
  </div>
  <script type="module" src="src/library.js"></script>
</body>
</html>
